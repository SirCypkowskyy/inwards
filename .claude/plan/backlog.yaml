- key: E3
  title: Catch hallucinations and dodges
  milestone: M3 · Catch hallucinations and dodges (v0.3)
  goal: 'Inwards flags the agent-specific failure modes: imports of first-party modules that don''t exist, dynamic imports
    that route around the layer rule, and frameworks leaking into the domain.'
  exit_criteria:
  - INW010, INW011 and INW005 shipped with docs and fix steps
  - An offline eval reports the fix-within-one-retry rate for each rule
  docs:
  - 04-AI-Integration/#catching-hallucinated-modules
  issues:
  - key: E3-rule-config
    title: 'Per-rule configuration: select, ignore, severity'
    type: feature
    area:
    - engine
    - rules
    priority: P1
    size: S
    why: Teams need to phase rules in; the registry from M1 makes this cheap.
    scope:
    - '`select`, `ignore` and per-rule severity in [tool.inwards]'
    - Changes to these keys are guarded like the rest of the table
    acceptance:
    - Tests for each key; unknown codes are config errors
    blocked_by:
    - E1-registry
  - key: E3-index
    title: Module index as an engine input for all adapters
    type: feature
    area:
    - engine
    - cli
    priority: P0
    size: S
    why: Cross-file rules need to know which modules exist. ADR-006 requires the adapter to supply it.
    scope:
    - Expose the E1-index structures through the engine API used by the language server and future MCP server
    - Documented contract for incremental updates
    acceptance:
    - The language server and CLI produce identical indexes for examples/
    docs:
    - 05-ADR/#adr-006-the-engine-does-no-io
    blocked_by:
    - E1-index
    - E2-decision
  - key: E3-inw010
    title: 'INW010 unknown-first-party: hallucinated module imports'
    type: feature
    area:
    - rules
    priority: P0
    size: M
    why: 'The typical agent hallucination: a plausible module that doesn''t exist.'
    scope:
    - Flag imports of first-party modules missing from the index
    - Fix steps list the closest real modules (edit distance)
    acceptance:
    - No false positives on the real-repo corpus (E2-corpus) or examples/
    blocked_by:
    - E3-index
    - E1-registry
    - E2-corpus
  - key: E3-inw011
    title: 'INW011 (non-literal targets): flag unverifiable dynamic imports in inner layers'
    type: feature
    area:
    - rules
    priority: P1
    size: M
    why: '`importlib.import_module` is the next dodge after function-level imports.'
    scope:
    - Non-literal targets of the calls covered by E1-inw011-literal, in inner layers, reported as unverifiable
    acceptance:
    - Tests for importlib.import_module, __import__, and aliases
    blocked_by:
    - E1-inw011-literal
  - key: E3-inw005
    title: 'INW005 pure-domain: third-party and I/O libraries per layer'
    type: feature
    area:
    - rules
    priority: P0
    size: M
    why: SQLAlchemy or FastAPI in the domain is the most common leak and isn't caught by INW001.
    scope:
    - Per-layer allow/deny lists of third-party packages; stdlib list bundled
    - Sensible default deny list for the innermost layer
    acceptance:
    - Distinguishes first-party, stdlib and third-party correctly
    blocked_by:
    - E3-index
    - E1-registry
  - key: E3-eval-rules
    title: Run the eval harness on INW010, INW011 and INW005
    type: spike
    area:
    - agent-kit
    - rules
    priority: P0
    size: S
    why: New rules need the same fix-rate evidence as INW001.
    scope:
    - Fixtures per rule; reuse the harness from E0-eval-inw001
    acceptance:
    - Per-rule fix rate and evasions in the eval report
    blocked_by:
    - E0-eval-inw001
    - E3-inw010
    - E3-inw011
    - E3-inw005
  - key: E3-ruledocs
    title: Per-rule documentation pages linked from diagnostics
    type: docs
    area:
    - docs
    - rules
    priority: P1
    size: S
    why: Diagnostics currently link to the rule catalogue; each rule needs examples, rationale and fixes.
    scope:
    - docs/rules/INWxxx pages; DOCS link per rule
    acceptance:
    - Every shipped rule has a page; links checked in CI
    - Pages in `zensical.toml` nav; strict build green
    blocked_by:
    - E1-registry
  - key: E3-suppress
    title: Inline suppressions with a mandatory reason
    type: feature
    area:
    - engine
    - agent-kit
    priority: P1
    size: M
    why: Suppressions are an evasion path; they must be visible and accountable.
    scope:
    - '`# inwards: ignore[INW001] reason="..."` on the import line'
    - Missing reason is itself a diagnostic; summary counts suppressions
    - Hook option to reject suppressions added by the agent
    acceptance:
    - Tests for valid, reasonless and unknown-code suppressions
    blocked_by: []
- key: E4
  title: Architectures beyond the onion
  milestone: M4 · Architectures beyond the onion (v0.4)
  goal: Vertical slices, bounded contexts and hexagonal public APIs can be expressed in config and are enforced, including
    import cycles.
  exit_criteria:
  - Config schema v2 published with a JSON Schema
  - INW002 and INW004 shipped
  - Warm full runs use the cache
  docs:
  - 03-Architecture-C4/#rule-catalogue
  issues:
  - key: E4-schema
    title: Config schema v2 with JSON Schema (contexts, public modules, patterns)
    type: feature
    area:
    - engine
    priority: P0
    size: M
    why: Non-linear rules need more syntax; ADR-005 promised separate tables so the simple case stays simple.
    scope:
    - Tables for contexts/slices and public modules; glob patterns for layer membership
    - JSON Schema published (SchemaStore) for editor completion
    - v1 configs keep working unchanged
    acceptance:
    - Schema validates all example configs; errors name the key
    docs:
    - 05-ADR/#adr-005-configuration-lives-in-pyprojecttoml
    blocked_by:
    - E2-decision
  - key: E4-inw002
    title: INW002 context-independence for bounded contexts and vertical slices
    type: feature
    area:
    - rules
    priority: P0
    size: M
    why: Slices reaching into each other's internals is the vertical-slice equivalent of INW001.
    scope:
    - Contexts may not import each other except through declared public modules
    acceptance:
    - Fixture with three slices covering allowed and forbidden cases
    blocked_by:
    - E4-schema
  - key: E4-inw003
    title: INW003 public-api-only
    type: feature
    area:
    - rules
    priority: P1
    size: M
    why: Hexagonal modules expose ports through a public module; importing internals couples callers to details.
    scope:
    - Imports must stop at the declared public module (`__init__` or `api.py`)
    acceptance:
    - Fix steps name the public symbol when it exists
    blocked_by:
    - E4-schema
  - key: E4-inw004
    title: Import graph and INW004 no-cycles
    type: feature
    area:
    - engine
    - rules
    - perf
    priority: P0
    size: L
    why: Cycles between modules or contexts are a classic architecture smell; Biome calls its cycle rule expensive, so design
      for caching.
    scope:
    - Graph built from cached import lists; cycles reported once, with the full path
    - Module-level and context-level modes
    acceptance:
    - Cold run on the synthetic repo stays within the < 1 s budget
    blocked_by:
    - E3-index
    - E4-cache
    - E4-schema
  - key: E4-importlinter
    title: Convert import-linter contracts (`inwards import-config`)
    type: feature
    area:
    - cli
    priority: P2
    size: M
    why: import-linter is the incumbent; migration should be one command.
    scope:
    - layers, forbidden and independence contracts mapped to v2 config
    - Report contracts that can't be mapped
    acceptance:
    - Round-trip on import-linter's own examples
    blocked_by:
    - E4-schema
  - key: E4-cache
    title: Content-hash cache of import lists (`.inwards/cache`)
    type: feature
    area:
    - perf
    - engine
    priority: P0
    size: M
    why: Unchanged files shouldn't be parsed again; also the base for the import graph.
    scope:
    - Keyed by file hash + engine version + grammar version
    - Safe under concurrent runs
    acceptance:
    - Warm full run on the synthetic repo at least 5x faster than cold
    blocked_by:
    - E2-bench
  - key: E4-roots
    title: Multi-package monorepos and namespace packages
    type: feature
    area:
    - engine
    - cli
    priority: P1
    size: M
    why: 'Known limitations in chapter 3: one root per config, namespace packages resolve relative imports as regular packages.'
    scope:
    - Several roots in one config, or per-file nearest-config discovery
    - Correct relative-import resolution in implicit namespace packages
    - The language server's first-workspace-folder limitation is handled in E6-server
    - Extend the E1-guard config pinning to multi-root discovery
    acceptance:
    - Fixture monorepo with two packages and a namespace package passes
    docs:
    - 03-Architecture-C4/#known-limitations
    blocked_by: []
  - key: E4-context
    title: '`inwards context`: architecture brief for AGENTS.md / CLAUDE.md (UC7)'
    type: feature
    area:
    - cli
    - agent-kit
    priority: P1
    size: M
    why: Avoiding a violation costs nothing; fixing one costs a retry.
    scope:
    - Compact layer map, allowed directions, where ports live
    - Updates a marked section in place
    - Behind a flag (`inwards init --brief`) so design partners can A/B it without confounding the violation-rate metric
    - '`inwards init` calls it when the flag is set'
    acceptance:
    - Brief under 300 tokens for the example config
    blocked_by:
    - E1-init
  tentative: true
- key: E5
  title: Speed at scale
  milestone: M5 · Speed at scale (v0.5)
  goal: Single-file hook checks stay well under 100 ms p95 on real repos, and cold full runs scale with cores, with regressions
    caught in CI.
  exit_criteria:
  - Hook p95 with the resident process, reported as the median of 10 benchmark runs on ubuntu-latest, under 50 ms
  - Cold 500k-line run at least 3x faster than single-threaded on ubuntu-latest (4 vCPU)
  - Resident-process ADR accepted
  docs:
  - 06-Constraints-and-Quality/#performance-roadmap
  issues:
  - key: E5-resident-adr
    title: 'Spike + ADR: resident process design (one process or two, protocol, names)'
    type: spike
    area:
    - perf
    - lsp
    priority: P0
    size: S
    why: The hook daemon and the LSP server could share one process. Chapter 6 and the backlog used conflicting names.
    scope:
    - Decide process model, socket protocol and command names
    - New ADR; chapter 6 and ADR-008 updated
    acceptance:
    - ADR accepted before E5-daemon starts
    blocked_by: []
  - key: E5-daemon
    title: Resident process for hooks (`inwards daemon`) with one-shot fallback
    type: feature
    area:
    - perf
    - cli
    priority: P0
    size: L
    why: About 25 ms of every hook call is process and WASM start-up; parsing is ~1 ms.
    scope:
    - Hooks talk to a per-repo daemon over a local socket; start on demand, exit when idle
    - Transparent fallback to one-shot runs
    acceptance:
    - Hook p95 < 50 ms in the benchmark job
    blocked_by:
    - E2-bench
    - E0-hook
    - E5-resident-adr
  - key: E5-workers
    title: Worker pool for cold full runs
    type: feature
    area:
    - perf
    - cli
    priority: P0
    size: M
    why: The engine runs on one core; CI runners have several.
    scope:
    - One parser per worker; deterministic output order
    acceptance:
    - At least 3x faster than single-threaded on ubuntu-latest (4 vCPU), deterministic output order
    blocked_by:
    - E2-bench
  - key: E5-cursor
    title: Replace `descendantsOfType` with a tree-cursor walk on the full-parse path
    type: chore
    area:
    - perf
    - engine
    priority: P2
    size: S
    why: Profiling spent 1.2 s there on the naive design; the full parse still runs for refused files and confirmations.
    scope:
    - Cursor-based extraction with identical results
    acceptance:
    - Prescan differential test unchanged; measurable speed-up on refused files
    blocked_by:
    - E2-bench
  tentative: true
