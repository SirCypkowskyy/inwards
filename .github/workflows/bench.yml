name: Bench

# Builds the base branch and the PR, runs both on the synthetic repo
# (bench/generate.py) in alternation, and fails when the PR is more than 20%
# slower on a metric. Same job, same runner, so runner noise hits both alike.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Performance against the base branch
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04-arm' || fromJSON('["self-hosted","linux","ARM64","inwards"]') }} # forks: GitHub-hosted (#333)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Each side is built with its own Bun, so a PR that bumps .bun-version is
      # measured against the old runtime.
      - name: Check out the base branch
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        # Persistent runner: a previous job's worktree is registered but its directory is gone.
        run: |
          git worktree prune
          git worktree add "$RUNNER_TEMP/base" "$BASE"
      - uses: ./.github/actions/setup-bun
        with:
          bun-version-file: ${{ runner.temp }}/base/.bun-version
      - name: Build the base branch's binary
        working-directory: ${{ runner.temp }}/base
        run: |
          bun install --frozen-lockfile
          bun run scripts/build-binaries.ts bun-linux-arm64
          cp dist/inwards-linux-arm64 "$RUNNER_TEMP/base-inwards"
      - uses: ./.github/actions/setup-bun
        with:
          bun-version-file: .bun-version
      - name: Build the PR's binary
        run: |
          bun install --frozen-lockfile
          bun run scripts/build-binaries.ts bun-linux-arm64
          cp dist/inwards-linux-arm64 "$RUNNER_TEMP/head-inwards"
      - name: Synthetic repo (2,100 files)
        run: python3 bench/generate.py "$RUNNER_TEMP/inwards-bench"
      - name: Compare
        shell: bash
        run: |
          bun run bench/compare.ts --base "$RUNNER_TEMP/base-inwards" --head "$RUNNER_TEMP/head-inwards" \
            --repo "$RUNNER_TEMP/inwards-bench" --out bench-result.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: bench-result
          path: bench-result.json
          if-no-files-found: ignore
