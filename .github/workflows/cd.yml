name: CD

# Tag a release with `git tag v0.1.0 && git push origin v0.1.0`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Cross-compile binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Tag must match the engine version
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(sed -nE 's/^export const VERSION = "(.*)";$/\1/p' src/core/src/meta.ts)"
          if [ "$want" != "$have" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $have in src/core/src/meta.ts"
            exit 1
          fi
      - run: bun test
      - name: Compile every target with Bun
        run: bun run scripts/build-binaries.ts
      - name: Build VS Code extension (.vsix)
        working-directory: src/vscode-extension
        run: |
          bun run build
          bun x @vscode/vsce package --no-dependencies --allow-missing-repository \
            -o "../../dist/inwards-vscode-${GITHUB_REF_NAME}.vsix"
      - name: Checksums
        working-directory: dist
        run: sha256sum inwards-* | grep -v '\.map' > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: inwards-${{ github.ref_name }}
          path: |
            dist/inwards-*
            dist/SHA256SUMS
            !dist/*.map
          if-no-files-found: error

  verify:
    name: Run on ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, bin: inwards-linux-x64 }
          - { os: ubuntu-24.04-arm, bin: inwards-linux-arm64 }
          - { os: macos-latest, bin: inwards-darwin-arm64 }
          - { os: macos-15-intel, bin: inwards-darwin-x64 }
          - { os: windows-latest, bin: inwards-windows-x64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: inwards-${{ github.ref_name }}
          path: dist
      - name: Binary starts and lints the example app
        shell: bash
        run: |
          chmod +x "dist/${{ matrix.bin }}"
          "dist/${{ matrix.bin }}" --version
          "dist/${{ matrix.bin }}" check --format json

  verify-musl:
    name: Run on Alpine (musl)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: inwards-${{ github.ref_name }}
          path: dist
      - name: Binary starts and lints the example app
        run: |
          chmod +x dist/inwards-linux-x64-musl
          docker run --rm -v "$PWD:/w" -w /w alpine:3 sh -euc '
            apk add --no-cache libstdc++ libgcc >/dev/null
            dist/inwards-linux-x64-musl --version
            dist/inwards-linux-x64-musl check --format json'
