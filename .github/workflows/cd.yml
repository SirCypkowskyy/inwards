name: CD

# Releases come from merging release-please's "chore: release X.Y.Z" PR
# (ADR-016): it tags vX.Y.Z and dispatches this workflow on the tag. A release
# candidate is still a hand-pushed tag with a suffix (v0.2.0-rc.1), pushed on
# the release PR's branch (it already holds the new version): it builds the
# same version and drafts a pre-release. Publishing the draft by hand starts
# pypi.yml, which uploads these same wheels to TestPyPI and PyPI (ADR-021).
on:
  push:
    tags: ["v*"]
  workflow_dispatch: # release-please's tag, pushed with GITHUB_TOKEN, starts nothing by itself

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}

# Every job here stays on GitHub-hosted runners, unlike CI (ops/runner): the
# shipped binaries are built on a clean, documented image rather than a home
# machine that other workloads share, the musl check needs Docker, and the
# verify matrix needs arm64, macOS and Windows anyway. It runs once per tag.
#
# Build provenance needs a public repository (private ones need GitHub
# Enterprise Cloud), so attestation steps are skipped while the repo is private.
env:
  ATTEST: ${{ github.event.repository.visibility == 'public' }}

jobs:
  build:
    name: Cross-compile binaries
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Tag must match every version field and the changelog
        run: |
          # Suffixes wheels can carry as PEP 440 pre-releases: v1.2.3, v1.2.3-rc.1, -a.1, -b.1.
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(a|alpha|b|beta|rc)\.?[0-9]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not vX.Y.Z or vX.Y.Z-(a|b|rc).N"
            exit 1
          fi
          want="${GITHUB_REF_NAME#v}"
          bash scripts/check-version.sh "${want%%-*}"
          # A final release must have its CHANGELOG section; a release candidate comes before it.
          if [[ "$want" != *-* ]] && ! grep -qE "^## \[?${want//./\\.}[] ]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for $want"
            exit 1
          fi
      - run: bun test
      - name: Compile every target with Bun
        run: bun run scripts/build-binaries.ts
      - name: Build VS Code extension (.vsix)
        working-directory: src/vscode-extension
        run: |
          bun run build
          bun x vsce package --no-dependencies --allow-missing-repository \
            -o "../../dist/inwards-vscode-${GITHUB_REF_NAME}.vsix"
      - name: Wrap each binary in a platform wheel (uv add / uvx)
        run: |
          python3 scripts/build-wheels.py dist "$GITHUB_REF_NAME"
          mv dist/wheels/*.whl dist/ && rmdir dist/wheels
      - name: Checksums
        working-directory: dist
        run: sha256sum inwards-* | grep -v '\.map' > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: inwards-${{ github.ref_name }}
          path: |
            dist/inwards-*
            dist/SHA256SUMS
            !dist/*.map
          if-no-files-found: error

  # Its own job, so the OIDC token never shares a runner with `bun install`.
  # Jobs holding write or OIDC permissions pin actions by commit SHA
  # (Dependabot keeps them current).
  attest:
    name: Attest build provenance
    needs: build
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: inwards-${{ github.ref_name }}
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

  verify:
    name: Run on ${{ matrix.os }}
    needs: [build, attest]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.attest.result != 'failure' }}
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04, bin: inwards-linux-x64 }
          - { os: ubuntu-24.04-arm, bin: inwards-linux-arm64 }
          - { os: macos-latest, bin: inwards-darwin-arm64 }
          - { os: macos-15-intel, bin: inwards-darwin-x64 }
          - { os: windows-latest, bin: inwards-windows-x64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: inwards-${{ github.ref_name }}
          path: dist
      - name: Binary starts and lints the example app
        shell: bash
        run: |
          chmod +x "dist/${{ matrix.bin }}"
          "dist/${{ matrix.bin }}" --version
          "dist/${{ matrix.bin }}" check --format json
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: The wheel installs with uvx and runs
        shell: bash
        run: |
          uvx --no-index --find-links dist --prerelease allow inwards --version
          uvx --no-index --find-links dist --prerelease allow inwards check --format json
      - name: Provenance verifies
        if: env.ATTEST == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "dist/${{ matrix.bin }}" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/cd.yml" --source-ref "$GITHUB_REF"

  verify-musl:
    name: Run on Alpine (musl)
    needs: [build, attest]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.attest.result != 'failure' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: inwards-${{ github.ref_name }}
          path: dist
      - name: Provenance verifies
        if: env.ATTEST == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify dist/inwards-linux-x64-musl --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/cd.yml" --source-ref "$GITHUB_REF"
      - name: Binary starts and lints the example app
        run: |
          chmod +x dist/inwards-linux-x64-musl
          docker run --rm -v "$PWD:/w" -w /w alpine:3 sh -euc '
            apk add --no-cache libstdc++ libgcc >/dev/null
            dist/inwards-linux-x64-musl --version
            dist/inwards-linux-x64-musl check --format json'

  release:
    name: Draft the GitHub Release
    needs: [verify, verify-musl]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.verify-musl.result == 'success' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: inwards-${{ github.ref_name }}
          path: dist
      - name: Draft release with binaries, wheels, .vsix and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && pre="--prerelease"
          # Idempotent for drafts: a re-run refreshes the draft's assets. A published
          # release is never overwritten; cut a new tag instead.
          if draft="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null)"; then
            if [ "$draft" != "true" ]; then
              echo "::error::$GITHUB_REF_NAME is already published; refusing to replace its assets"
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
              --draft --generate-notes $pre
          fi
