name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  # macOS, Windows and the older Ubuntu run nightly and on demand only, while
  # Actions minutes are limited (#126); PRs and pushes test on ubuntu-26.04.
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # By event too: a nightly run on develop is the only macOS/Windows coverage,
  # so a push to develop must not cancel it, nor it a push run.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Lint, typecheck, prescan
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Every version field matches .release-please-manifest.json
        run: bash scripts/check-version.sh
      - name: CLAUDE.md only imports AGENTS.md (edit AGENTS.md instead)
        run: test "$(cat CLAUDE.md)" = "@AGENTS.md"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Biome (lint + format)
        run: bun x biome ci .
      - name: Every function has a TSDoc block (oxlint + eslint-plugin-jsdoc)
        run: bun run lint:docs
      - name: Typecheck
        run: bun run typecheck
      - name: Fallow (dead code, unused deps, architecture boundaries, duplication)
        run: bun run fallow
      # A full CPython: Ubuntu 26.04's python3 ships its stdlib tests in a separate
      # package, which shrank the corpus from 2,273 files to 626.
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.14"
      - name: Prescan never misses an import (generated spellings + the Python stdlib)
        run: |
          stdlib="$("${{ steps.python.outputs.python-path }}" -c 'import sysconfig; print(sysconfig.get_paths()["stdlib"])')"
          bun run src/core/scripts/prescan-diff.ts "$stdlib" 1500
      - name: Dogfood - inwards checks its own example app
        run: bun run check:self
      - name: Build VS Code extension
        working-directory: src/vscode-extension
        run: bun run build

  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Nightly and manual runs: both Ubuntu images (until ubuntu-latest moves
        # to 26.04 on 2026-10-19), macOS and Windows. PRs and pushes: ubuntu-26.04
        # only, to save Actions minutes (#126); revert this to test all four on PRs.
        include: >-
          ${{ fromJSON(
            (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
            && '[{"os":"ubuntu-24.04","target":"bun-linux-x64","bin":"inwards-linux-x64"},{"os":"ubuntu-26.04","target":"bun-linux-x64","bin":"inwards-linux-x64"},{"os":"macos-latest","target":"bun-darwin-arm64","bin":"inwards-darwin-arm64"},{"os":"windows-latest","target":"bun-windows-x64","bin":"inwards-windows-x64.exe"}]'
            || '[{"os":"ubuntu-26.04","target":"bun-linux-x64","bin":"inwards-linux-x64"}]'
          ) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Compile the binary for this OS (catches WASM embedding regressions)
        run: bun run scripts/build-binaries.ts ${{ matrix.target }}
      - name: Unit and end-to-end tests against the compiled binary
        run: bun test
        env:
          INWARDS_BIN: dist/${{ matrix.bin }}
      - name: Binary lints the example app
        run: |
          dist/${{ matrix.bin }} --version
          dist/${{ matrix.bin }} check --format json > /dev/null
      - name: SARIF from this OS validates against the 2.1.0 schema, with forward slashes
        run: |
          mkdir -p "$RUNNER_TEMP/sarif/shop/domain/deep"
          cd "$RUNNER_TEMP/sarif"
          printf '[tool.inwards]\nlayers = [{ name = "domain", modules = ["shop.domain"] }, { name = "infra", modules = ["shop.infra"] }]\n' > pyproject.toml
          echo 'import shop.infra.db' > shop/domain/deep/order.py
          "$GITHUB_WORKSPACE/dist/${{ matrix.bin }}" check --format sarif > out.json || test $? -eq 1
          grep -q '"uri":"shop/domain/deep/order.py"' out.json
          curl -sSfL https://json.schemastore.org/sarif-2.1.0.json -o schema.json
          npx -y -p ajv-cli@5 -p ajv-formats@3 ajv validate --spec=draft7 -c ajv-formats --strict=false -s schema.json -d out.json

  docs:
    name: Docs build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # upstream has no floating major tag
      - name: Every page under docs/chapters is in the nav
        run: uv run scripts/check-docs-nav.py
      - name: Build site (strict)
        run: uv run zensical build -f docs/zensical.toml --clean --strict
      # The strict build already rejects Markdown links to missing pages or
      # anchors; lychee also covers raw HTML hrefs, theme links and assets.
      # Offline, so a third-party outage never fails a PR: docs-links.yml checks
      # external links weekly. 404.html is skipped: its theme links are absolute
      # (/inwards/...) and its skip link targets an anchor that page lacks.
      - name: Internal links in the built site resolve (lychee)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          token: "" # offline: no GitHub API calls, so no token for the action to hold
          args: >-
            --offline --no-progress --include-fragments --index-files index.html
            --exclude-path docs/site/404.html docs/site
