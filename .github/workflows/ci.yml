name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Lint, typecheck, prescan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Biome (lint + format)
        run: bun x biome ci .
      - name: Typecheck
        run: bun run typecheck
      - name: Prescan never misses an import (generated spellings + the Python stdlib)
        run: bun run src/core/scripts/prescan-diff.ts "$(python3 -c 'import sysconfig; print(sysconfig.get_paths()["stdlib"])')"
      - name: Dogfood - inwards checks its own example app
        run: bun run check:self
      - name: Build VS Code extension
        working-directory: src/vscode-extension
        run: bun run build

  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: bun-linux-x64, bin: inwards-linux-x64 }
          - { os: macos-latest, target: bun-darwin-arm64, bin: inwards-darwin-arm64 }
          - { os: windows-latest, target: bun-windows-x64, bin: inwards-windows-x64.exe }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Compile the binary for this OS (catches WASM embedding regressions)
        run: bun run scripts/build-binaries.ts ${{ matrix.target }}
      - name: Unit and end-to-end tests against the compiled binary
        run: bun test
        env:
          INWARDS_BIN: dist/${{ matrix.bin }}
      - name: Binary lints the example app
        run: |
          dist/${{ matrix.bin }} --version
          dist/${{ matrix.bin }} check --format json > /dev/null

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # upstream has no floating major tag
      - name: Build site (strict)
        run: uv run zensical build -f docs/zensical.toml --clean --strict
