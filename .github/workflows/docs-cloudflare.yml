name: Docs (Cloudflare)

# Dormant alternative to docs.yml (see ADR-012). Needs an API token with
# Account > Workers Scripts > Edit in CLOUDFLARE_API_TOKEN, plus CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build with Zensical, deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # upstream has no floating major tag
      - run: uv run zensical build -f docs/zensical.toml --clean --strict
      # Wrangler runs through npx on purpose: wrangler-action installs it into the
      # repo with npm, which can't resolve Bun's `workspace:*` dependencies.
      - name: Deploy to Cloudflare Workers
        working-directory: docs
        shell: bash # adds pipefail, so a failed deploy isn't hidden by tee
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.140.0 deploy | tee deploy.log
          echo "url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)" >> "$GITHUB_OUTPUT"
