name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "pyproject.toml", "uv.lock", ".github/workflows/docs.yml"]
  workflow_dispatch:

# Only the deploy job can write to Pages or mint an OIDC token, and it runs
# nothing but a SHA-pinned deploy action. The build runs third-party code
# (uv, Zensical) with read access only.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build with Zensical
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: astral-sh/setup-uv@v10.2.0 # upstream has no floating major tag
      # Zensical asks for clean builds on CI while its cache format settles.
      - run: uv run zensical build -f docs/zensical.toml --clean --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
