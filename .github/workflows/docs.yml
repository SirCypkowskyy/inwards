name: Docs

on:
  push:
    branches: [develop]
    paths: ["docs/**", "schema/**", "scripts/check-docs-translation.py", "scripts/publish-schema.sh", "pyproject.toml", "uv.lock", ".github/workflows/docs.yml"]
  workflow_dispatch:

# Only the deploy job can write to Pages or mint an OIDC token, and it runs
# nothing but a SHA-pinned deploy action. The build runs third-party code
# (uv, Zensical) with read access only.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build with Zensical
    runs-on: [self-hosted, linux, ARM64, inwards] # ops/runner
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # Zensical asks for clean builds on CI while its cache format settles.
      # English first (its --clean empties docs/site/), then Polish into docs/site/pl/.
      - run: uv run zensical build -f docs/zensical.toml --clean --strict
      # Stale Polish pages get a "may be out of date" banner in this checkout only.
      # ci.yml already fails a PR on a missing translation; don't block the deploy.
      # (This also hides a crash of the script: the Polish site then ships without banners.)
      - run: uv run scripts/check-docs-translation.py --mark-stale
        continue-on-error: true
      - run: uv run zensical build -f docs/zensical.pl.toml --clean --strict
      # The [tool.inwards] JSON Schema, served where its $id points.
      - run: bash scripts/publish-schema.sh
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-26.04 # holds a Pages write token and OIDC: GitHub-hosted (ops/runner/README.md)
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
