name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "pyproject.toml", "uv.lock", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build with Zensical, deploy to Cloudflare
    runs-on: ubuntu-latest
    environment:
      name: docs
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # upstream has no floating major tag
      # Zensical asks for clean builds on CI while its cache format settles.
      - run: uv run zensical build -f docs/zensical.toml --clean --strict
      # Wrangler runs through npx on purpose: wrangler-action installs it into the
      # repo with npm, which can't resolve Bun's `workspace:*` dependencies.
      - name: Deploy to Cloudflare Workers
        id: deploy
        working-directory: docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.140.0 deploy | tee deploy.log
          echo "url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)" >> "$GITHUB_OUTPUT"
