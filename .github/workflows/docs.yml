name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "pyproject.toml", "uv.lock", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build with Zensical, deploy to Cloudflare
    runs-on: ubuntu-latest
    environment:
      name: docs
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # upstream has no floating major tag
      # Zensical asks for clean builds on CI while its cache format settles.
      - run: uv run zensical build -f docs/zensical.toml --clean --strict
      - id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs
          wranglerVersion: "4.140.0"
          command: deploy
