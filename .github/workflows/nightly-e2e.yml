name: Nightly E2E

# Re-records the Claude Code hook payloads with a headless `claude -p` session
# and compares their shape (field names and JSON types) with the fixtures in
# src/cli/test/fixtures/claude-code. Drift opens an issue, or comments on the
# open one. Needs the ANTHROPIC_API_KEY secret; without it the job skips with
# a notice. Each run is one Haiku session, capped at $0.25.
# The doc-snippet E2E cases run on every PR in ci.yml's test job
# (src/cli/test/docs.test.ts).
on:
  schedule:
    - cron: "41 3 * * *" # daily, 03:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payloads:
    name: Claude Code hook payloads match the fixtures
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Skip without the ANTHROPIC_API_KEY secret
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "::notice::ANTHROPIC_API_KEY is not set; hook payloads were not re-recorded."
      - uses: actions/checkout@v7
        if: env.ANTHROPIC_API_KEY != ''
      - uses: oven-sh/setup-bun@v2
        if: env.ANTHROPIC_API_KEY != ''
        with:
          bun-version-file: .bun-version
      - name: Install Claude Code
        if: env.ANTHROPIC_API_KEY != ''
        run: npm install -g @anthropic-ai/claude-code
      - name: Record and compare
        id: drift
        if: env.ANTHROPIC_API_KEY != ''
        shell: bash # -o pipefail, so a failed check fails the step through tee
        run: bun run scripts/claude-payload-drift.ts "$RUNNER_TEMP/rec" | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/drift.md"
      - uses: actions/upload-artifact@v7
        if: always() && env.ANTHROPIC_API_KEY != ''
        with:
          name: claude-code-payloads
          path: ${{ runner.temp }}/rec/payloads
          if-no-files-found: ignore
      - name: Open or update the drift issue
        if: failure() && steps.drift.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Claude Code hook payloads drifted from the recorded fixtures
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            if [ -s "$RUNNER_TEMP/drift.md" ]; then
              cat "$RUNNER_TEMP/drift.md"
            else
              echo "The recording failed before any comparison (a Claude Code or API error); see the run log."
            fi
            printf '\nRun: %s (the recorded payloads are its artifact).\n' "$RUN"
            printf 'Refresh the fixtures as src/cli/test/fixtures/claude-code/README.md describes, then review the snapshot diff.\n'
          } > body.md
          n="$(gh issue list --state open --search "in:title \"$TITLE\"" --json number -q '.[0].number')"
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md --label area:ci
          fi
