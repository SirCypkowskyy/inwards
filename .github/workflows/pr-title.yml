name: PR title

# The PR title becomes the squash commit on develop and, after a release, its CHANGELOG line (ADR-017, ADR-019).
on:
  pull_request_target: # reads the title only; never checks out PR code
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional:
    name: Conventional Commit title
    runs-on: [self-hosted, linux, x64, inwards] # irysek, ops/runner
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            deps
            revert
            docs
            refactor
            test
            build
            ci
            chore
