name: Release PR

# Keeps a "chore: release X.Y.Z" PR open against main with the next version and
# the new CHANGELOG section (ADR-016). Merging it tags vX.Y.Z, drafts the GitHub
# Release and starts cd.yml. The release commit stays on main (ADR-019).
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please

jobs:
  release-please:
    # Self-hosted like CI: it builds nothing and runs no repository code, and its
    # write token lives only as long as the job's fresh container. The release
    # build itself (cd.yml) stays GitHub-hosted.
    runs-on: [self-hosted, linux, x64, inwards] # irysek, ops/runner
    permissions:
      contents: write # release branch, tag, draft release
      pull-requests: write # open and label the release PR
      issues: write # release-please creates its labels
      actions: write # dispatch cd.yml
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: main # the default would be the repo's default branch, develop
      # A tag pushed with GITHUB_TOKEN starts no workflow; workflow_dispatch is
      # the documented exception, so start cd.yml on the new tag explicitly.
      - name: Build the release
        if: steps.rp.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rp.outputs.tag_name }}
        run: gh workflow run cd.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
