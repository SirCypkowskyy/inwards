name: SARIF

# Dogfoods the CI template from docs/chapters/guides/ci.md on
# examples/broken-app, whose one INW001 violation is there on purpose. The only
# differences from the template: inwards runs from source, and exit code 1 is
# the expected result, so the job fails when the violation or its annotation
# goes missing.
#
# Code scanning on a private repository needs GitHub Code Security, which a
# personal account can't buy, so the upload fails here with 403 until the
# repository is public. continue-on-error keeps that from failing the job; the
# workflow-command annotations cover the PR in the meantime.
on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: sarif-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sarif:
    name: SARIF on examples/broken-app
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04-arm' || fromJSON('["self-hosted","linux","ARM64","inwards"]') }} # forks: GitHub-hosted (#333)
    permissions:
      contents: read
      actions: read # upload-sarif, private repositories only
      security-events: write # upload-sarif
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Check the broken app (exit code 1 expected)
        run: |
          status=0
          bun run src/cli/src/main.ts check --config examples/broken-app/pyproject.toml --format sarif > inwards.sarif || status=$?
          test "$status" -eq 1
          jq -e '[.runs[].results[] | select(.ruleId == "INW001")] | length == 1' inwards.sarif
      - name: Annotate the pull request
        run: |
          status=0
          bun run src/cli/src/main.ts check --config examples/broken-app/pyproject.toml --format github > annotations.txt || status=$?
          cat annotations.txt
          test "$status" -eq 1
          grep -q '^::error file=examples/broken-app/shop/domain/order.py,line=3,.*title=INW001::' annotations.txt
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        continue-on-error: ${{ github.event.repository.private }}
        with:
          sarif_file: inwards.sarif
          category: inwards
