# Zensical site for the Polish translation of the Inwards docs (issue #149).
# docs/pl/ mirrors every page of docs/chapters/ at the same path; English is
# the source of truth. Build the English site first (its --clean empties
# docs/site/), then this one into docs/site/pl/:
#   uv run zensical build -f docs/zensical.toml --clean --strict
#   uv run zensical build -f docs/zensical.pl.toml --clean --strict
# Images, CSS and scripts come from the English site through "../" paths, so
# preview the pair with a static server on docs/site/, not `zensical serve`.
# scripts/check-docs-translation.py checks that every page is translated and
# up to date; docs/GLOSSARY.pl.md fixes the terminology.
# Keep the theme features and markdown_extensions identical to
# docs/zensical.toml: the translation check compares them.

[project]
site_name = "Inwards"
site_url = "https://sircypkowskyy.github.io/inwards/pl/"
repo_url = "https://github.com/SirCypkowskyy/inwards"
repo_name = "SirCypkowskyy/inwards"
site_description = "Linter architektury dla Pythona, który trzyma agentów AI wewnątrz twoich warstw."
site_author = "Opiekunowie projektu Inwards"
copyright = "Copyright &copy; 2026 opiekunowie projektu Inwards"
docs_dir = "pl"
site_dir = "site/pl"

extra_css = [
  "../stylesheets/theme.css",
  "../stylesheets/extra.css",
  "../stylesheets/home.css",
  "../stylesheets/rules.css",
]

extra_javascript = [
  "../javascripts/homepage-loop.mjs",
  "../javascripts/language-switch.mjs",
  "../javascripts/rule-index.mjs",
]

nav = [
  { "Start" = "index.md" },
  { "Poradniki" = [
    { "Instalacja" = "guides/install.md" },
    { "Konfiguracja" = "guides/configuration.md" },
    { "Neovim, Zed i Helix" = "guides/editors.md" },
    { "Claude Code" = "guides/claude-code.md" },
    { "OpenCode" = "guides/opencode.md" },
    { "Aider" = "guides/aider.md" },
    { "AGENTS.md (Codex, Cursor, …)" = "guides/agents-md.md" },
    { "Serwer MCP" = "guides/mcp.md" },
    { "GitHub Actions" = "guides/ci.md" },
    { "Kształt pakietu" = "guides/package-shape.md" },
    { "Biblioteki w warstwach" = "guides/libraries.md" },
    { "Migracja z import-linter" = "guides/import-linter.md" },
  ] },
  { "Reguły" = [
    { "Przegląd" = "rules/index.md" },
    { "INW000 unsupported-encoding" = "rules/INW000.md" },
    { "INW001 layer-dependency" = "rules/INW001.md" },
    { "INW002 context-independence" = "rules/INW002.md" },
    { "INW003 public-api-only" = "rules/INW003.md" },
    { "INW004 import-cycles" = "rules/INW004.md" },
    { "INW005 pure-domain" = "rules/INW005.md" },
    { "INW006 unassigned-module" = "rules/INW006.md" },
    { "INW007 package-shape" = "rules/INW007.md" },
    { "INW008 missing-member" = "rules/INW008.md" },
    { "INW009 suppression-comment" = "rules/INW009.md" },
    { "INW010 unknown-first-party" = "rules/INW010.md" },
    { "INW011 dynamic-import" = "rules/INW011.md" },
    { "INW012 thin-endpoint" = "rules/INW012.md" },
    { "INW013 async-blocking" = "rules/INW013.md" },
    { "INW015 construct-only-in" = "rules/INW015.md" },
    { "INW016 orm-naming" = "rules/INW016.md" },
    { "FAPI001 endpoint-metadata" = "rules/FAPI001.md" },
    { "FAPI002 undocumented-error-response" = "rules/FAPI002.md" },
    { "FAPI003 router-wiring" = "rules/FAPI003.md" },
    { "FAPI005 route-shadowing" = "rules/FAPI005.md" },
    { "FAPI006 lifespan-events" = "rules/FAPI006.md" },
    { "FAPI007 yield-dependency-swallows" = "rules/FAPI007.md" },
    { "FAPI008 duplicate-operation-id" = "rules/FAPI008.md" },
    { "FAPI009 depends-called" = "rules/FAPI009.md" },
  ] },
  { "Jak to działa" = [
    { "Integracja z AI" = "04-AI-Integration.md" },
    { "Architektura (C4)" = "03-Architecture-C4.md" },
    { "Ograniczenia i jakość" = "06-Constraints-and-Quality.md" },
  ] },
  { "Projekt" = [
    { "Wprowadzenie" = "01-Introduction.md" },
    { "Kontekst biznesowy" = "02-Business-Context.md" },
    { "Decyzje (ADR)" = "05-ADR.md" },
    { "Słownik" = "07-Glossary.md" },
    { "Run log" = "08-Run-Log.md" },
    { "Design partnerzy" = "guides/design-partners.md" },
  ] },
]

# The header's language selector. Links are relative to this site's root;
# docs/overrides/partials/alternate.html keeps the current page.
[project.extra]
alternate = [
  { name = "English", link = "../", lang = "en" },
  { name = "Polski", link = "./", lang = "pl" },
]

[project.theme]
font = false
language = "pl"
custom_dir = "overrides"
features = [
  "content.code.copy",
  "content.code.annotate",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "material/weather-night"
toggle.name = "Przełącz na tryb ciemny"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "material/weather-sunny"
toggle.name = "Przełącz na tryb jasny"

# Setting markdown_extensions replaces Zensical's defaults, so list all we use.
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.tasklist.custom_checkbox = true
pymdownx.tabbed.alternate_style = true
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
