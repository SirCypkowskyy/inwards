# Zensical site for the Inwards architecture docs, in English.
#   uv run zensical serve -f docs/zensical.toml          # live preview
#   uv run zensical build -f docs/zensical.toml --clean  # writes docs/site/
# The Polish translation (docs/zensical.pl.toml) builds into docs/site/pl/
# afterwards; run the English build first, since --clean empties docs/site/.
# .github/workflows/docs.yml publishes docs/site/ to GitHub Pages (ADR-012).
# docs/wrangler.jsonc keeps the Cloudflare Workers option ready (docs-cloudflare.yml).

[project]
site_name = "Inwards"
site_url = "https://sircypkowskyy.github.io/inwards/"
repo_url = "https://github.com/SirCypkowskyy/inwards"
repo_name = "SirCypkowskyy/inwards"
site_description = "Architecture linter for Python that keeps AI coding agents inside your layers."
site_author = "Inwards maintainers"
copyright = "Copyright &copy; 2026 Inwards maintainers"
docs_dir = "chapters"
site_dir = "site"

extra_css = [
  "stylesheets/extra.css",
]

extra_javascript = [
  "javascripts/homepage-loop.mjs",
  "javascripts/language-switch.mjs",
]

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Install" = "guides/install.md" },
    { "Configuration" = "guides/configuration.md" },
    { "Claude Code" = "guides/claude-code.md" },
    { "OpenCode" = "guides/opencode.md" },
    { "Aider" = "guides/aider.md" },
    { "AGENTS.md (Codex, Cursor, …)" = "guides/agents-md.md" },
    { "GitHub Actions" = "guides/ci.md" },
    { "Package shape" = "guides/package-shape.md" },
    { "Libraries per layer" = "guides/libraries.md" },
    { "Migrating from import-linter" = "guides/import-linter.md" },
    { "Design partners" = "guides/design-partners.md" },
  ] },
  { "Rules" = [
    { "Overview" = "rules/index.md" },
    { "INW000 unsupported-encoding" = "rules/INW000.md" },
    { "INW001 layer-dependency" = "rules/INW001.md" },
    { "INW002 context-independence" = "rules/INW002.md" },
    { "INW003 public-api-only" = "rules/INW003.md" },
    { "INW004 import-cycles" = "rules/INW004.md" },
    { "INW005 pure-domain" = "rules/INW005.md" },
    { "INW006 unassigned-module" = "rules/INW006.md" },
    { "INW007 package-shape" = "rules/INW007.md" },
    { "INW008 missing-member" = "rules/INW008.md" },
    { "INW009 suppression-comment" = "rules/INW009.md" },
    { "INW010 unknown-first-party" = "rules/INW010.md" },
    { "INW011 dynamic-import" = "rules/INW011.md" },
    { "FAPI001 endpoint-metadata" = "rules/FAPI001.md" },
    { "FAPI002 undocumented-error-response" = "rules/FAPI002.md" },
    { "FAPI003 router-wiring" = "rules/FAPI003.md" },
    { "FAPI006 lifespan-events" = "rules/FAPI006.md" },
    { "FAPI007 yield-dependency-swallows" = "rules/FAPI007.md" },
  ] },
  { "1. Introduction" = "01-Introduction.md" },
  { "2. Business context" = "02-Business-Context.md" },
  { "3. Architecture (C4)" = "03-Architecture-C4.md" },
  { "4. AI integration" = "04-AI-Integration.md" },
  { "5. Decisions (ADR)" = "05-ADR.md" },
  { "6. Constraints and quality" = "06-Constraints-and-Quality.md" },
  { "7. Glossary" = "07-Glossary.md" },
  { "8. Run log" = "08-Run-Log.md" },
]

# The header's language selector. Links are relative to this site's root;
# docs/overrides/partials/alternate.html keeps the current page.
[project.extra]
alternate = [
  { name = "English", link = "./", lang = "en" },
  { name = "Polski", link = "pl/", lang = "pl" },
]

[project.theme]
language = "en"
custom_dir = "overrides"
features = [
  "content.code.copy",
  "content.code.annotate",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "material/layers-triple"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep purple"
accent = "amber"
toggle.icon = "material/weather-night"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep purple"
accent = "amber"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to light mode"

# Setting markdown_extensions replaces Zensical's defaults, so list all we use.
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.tasklist.custom_checkbox = true
pymdownx.tabbed.alternate_style = true
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
