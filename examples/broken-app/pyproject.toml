# CI fixture: shop/orders/models.py imports the orders' adapters on purpose,
# so `inwards check` here must exit 1 with one INW001. .github/workflows/sarif.yml
# relies on that violation; don't fix it.
[tool.inwards]
layers = [{ name = "slice", modules = ["shop.*"], template = "slice" }]

[tool.inwards.templates.slice]
roles = ["models", "ports", "adapters"]
