# Root project for the Inwards monorepo.
#
# The engine is TypeScript (see package.json and src/). This file does two jobs:
#   1. It holds the Python-side tooling: Zensical for the docs site.
#   2. It is the future home of the `inwards` PyPI package, a thin wheel that
#      ships the Bun-compiled binary so users can `uv add --dev inwards`
#      (the same distribution trick Ruff and ty use). PyPI publishing is out of
#      scope for now, so the project is marked as non-packaged for uv.
#
# It also dogfoods Inwards: [tool.inwards] below is the reference config that
# the docs and the example app use.

[project]
name = "inwards"
# release-please stamps the next line; keep a line nobody edits on each side of
# it, or every promotion to main conflicts (ADR-019).
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Architecture linter for Python that keeps AI coding agents inside your layers."
readme = "README.md"
requires-python = ">=3.11"  # scripts/check-docs-nav.py uses tomllib
keywords = ["linter", "architecture", "ddd", "clean-architecture", "ai-agents"]
classifiers = [
  "Private :: Do Not Upload",
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[dependency-groups]
docs = ["zensical>=0.0.65"]

[tool.uv]
package = false
default-groups = ["docs"]

# Reference configuration, consumed by `inwards check`. CI also checks it with
# the latest release from PyPI (ci.yml, job "dogfood"), which pins the version.
# No required-version here: develop's own build reports 0.1.0 (ADR-019) and
# would refuse the config.
[tool.inwards]
root = "examples/clean-app"
cycles = ["modules", "contexts"]
# Layers are listed from the innermost (most stable) to the outermost.
# A module may import its own layer or any layer listed before it.
# Every package under shop is a slice (shop.shared too), laid out by the
# "slice" template; shop.main is the composition root.
layers = [
  { name = "slice", modules = ["shop.*"], template = "slice" },
  { name = "bootstrap", modules = ["shop.main"] },
]

# One template says what every slice looks like: its modules innermost first
# ("a | b" are siblings that may not import each other), and the modules other
# code may import.
[tool.inwards.templates.slice]
roles = ["models", "ports", "services", "commands | queries | adapters", "api", "factory"]
public = ["api", "factory"]
allow = []
require = ["__init__", "models", "ports"]
hints = ["Code more than one slice uses goes in shop.shared."]

[tool.inwards.templates.slice.rules]
ports = { ports-abstract = true }
adapters = { construct-only-in = { allowed-in = ["shop.*.factory", "shop.main"] } }

[[tool.inwards.shape]]
packages = ["shop.*"]
template = "slice"

# Slices never import each other; shop.main passes one slice's API to another
# as a port (the catalog is the orders' PriceList).
[[tool.inwards.contexts]]
name = "catalog"
modules = ["shop.catalog"]
depends-on = ["shared"]
template = "slice"

[[tool.inwards.contexts]]
name = "orders"
modules = ["shop.orders"]
depends-on = ["shared"]
template = "slice"

[[tool.inwards.contexts]]
name = "shared"
modules = ["shop.shared"]
public = ["shop.shared"]
