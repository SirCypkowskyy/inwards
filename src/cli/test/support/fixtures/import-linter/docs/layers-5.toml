[tool.importlinter]
root_package = "mypackage"

[[tool.importlinter.contracts]]
name = "My multiple package layers contract"
type = "layers"
layers = [
    "high",
    "(medium)",
    "low",
]
containers = [
    "mypackage.foo",
    "mypackage.bar",
    "mypackage.baz",
]
exhaustive = true
exhaustive_ignores = [
    "utils",
]
